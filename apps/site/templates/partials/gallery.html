<section id="gallery" class="py-32 bg-white dark:bg-dark-bg relative z-10 overflow-hidden select-none">
    <div class="container mx-auto px-4 text-center relative">
        <h2 class="text-4xl font-black uppercase italic tracking-tighter mb-16 reveal">Галерея</h2>

        {% if gallery %}
        <div class="relative px-0 md:px-4 max-w-6xl mx-auto reveal">
            <button type="button" id="prevBtn" aria-label="Предыдущие фото" class="absolute left-2 md:-left-16 top-1/2 -translate-y-1/2 z-30 bg-black/30 backdrop-blur-md md:bg-transparent text-white md:text-gray-400 md:hover:text-redline-red p-3 md:p-4 rounded-full transition-all hover:scale-110 active:scale-95">
                <svg class="w-8 h-8 md:w-10 md:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
            </button>

            <div class="overflow-hidden w-full rounded-3xl ring-1 ring-black/5 dark:ring-white/10">
                <div id="gallery-track" class="flex gap-4 md:gap-6 will-change-transform">
                    {% for name in gallery %}
                    <button type="button" data-index="{{ loop.index0 }}" aria-label="Открыть фото {{ loop.index }} из {{ gallery|length }}" class="gallery-item flex-shrink-0 w-full md:w-[calc(50%-12px)] lg:w-[calc(25%-18px)] aspect-video group/item relative overflow-hidden rounded-3xl bg-gray-100 dark:bg-white/5">
                        <img src="/static/gallery/{{ name|urlencode }}" alt="" loading="lazy" decoding="async" class="w-full h-full object-cover transition duration-700 group-hover/item:scale-110 group-hover/item:brightness-75">
                        <span class="absolute inset-0 flex items-center justify-center opacity-0 group-hover/item:opacity-100 group-focus-visible/item:opacity-100 transition duration-300">
                            <span class="bg-redline-red/80 text-white p-3 rounded-full backdrop-blur-sm shadow-xl scale-50 group-hover/item:scale-100 transition duration-300">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                            </span>
                        </span>
                    </button>
                    {% endfor %}
                </div>
            </div>

            <button type="button" id="nextBtn" aria-label="Следующие фото" class="absolute right-2 md:-right-16 top-1/2 -translate-y-1/2 z-30 bg-black/30 backdrop-blur-md md:bg-transparent text-white md:text-gray-400 md:hover:text-redline-red p-3 md:p-4 rounded-full transition-all hover:scale-110 active:scale-95">
                <svg class="w-8 h-8 md:w-10 md:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <p class="mt-8 text-gray-500 text-xs font-bold tracking-widest uppercase">Нажми на фото для увеличения · {{ gallery|length }} фото</p>
        {% else %}
        <p class="text-gray-500">Скриншоты скоро появятся.</p>
        {% endif %}
    </div>
</section>
