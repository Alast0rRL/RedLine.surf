# Подключается в каждом location: add_header внутри location отменяет заголовки уровня server.
# wasm-unsafe-eval — для rust-крипто и Opus-кодека; blob: — расшифрованные медиа и воркеры.
add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
